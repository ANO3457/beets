name: Validate export documentation formatting
on:
  push:
    branches: ['validation/codex23-beets-docs']
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: '3.11'
      - run: uv tool install 'poethepoet>=0.26,<0.47.0'
      - run: poe install --group docs
      - run: poe format-docs --check
      - run: poe lint-docs
      - run: poe docs -- -e 'SPHINXOPTS=--fail-on-warning --keep-going'
